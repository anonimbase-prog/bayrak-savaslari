<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bayrak Savaşları</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bayrak Savaşları">
<meta name="theme-color" content="#0f2747">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;600;800&display=swap">
<style>
:root{--bg:#e9eef3;--panel:rgba(255,255,255,.9);--card:#ffffff;--paper:#f4f6f9;--ink:#15202b;--muted:#5c6b7a;--line:#d5dde6;--accent:#e8590c;--gold:#f59f00;--ok:#2f9e44;--bad:#e03131;--shadow:rgba(20,30,45,.18);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1117;--panel:rgba(20,27,36,.92);--card:#18212c;--paper:#111821;--ink:#e8eef5;--muted:#9aa9b9;--line:#2a3745;--accent:#ff7a3d;--gold:#ffc53d;--ok:#51cf66;--bad:#ff6b6b;--shadow:rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1117;--panel:rgba(20,27,36,.92);--card:#18212c;--paper:#111821;--ink:#e8eef5;--muted:#9aa9b9;--line:#2a3745;--accent:#ff7a3d;--gold:#ffc53d;--ok:#51cf66;--bad:#ff6b6b;--shadow:rgba(0,0,0,.55);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
h1,h2,h3,h4,.disp,.btn{font-family:"Lilita One",Rubik,system-ui,sans-serif;font-weight:400;letter-spacing:.01em}
h2{margin:.15em 0}h3{margin:.9em 0 .45em}h4{margin:.8em 0 .3em}
.wrap{max-width:1400px;margin:0 auto;padding:12px}.wrap.wide{max-width:1700px}
.logo{margin:0;color:var(--accent);line-height:1}.logo.sm{font-size:clamp(22px,3.6vw,32px);text-shadow:2px 2px 0 rgba(0,0,0,.25)}
.muted{color:var(--muted)}.small{font-size:13px}.center{text-align:center}.grow{flex:1;min-width:0}
.btn{border:0;border-radius:14px;padding:11px 18px;font-size:18px;background:linear-gradient(180deg,#ff8a3d,var(--accent));color:#fff;cursor:pointer;box-shadow:0 4px 0 #9a3412,0 8px 18px rgba(232,89,12,.3);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9a3412}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line);border:1px solid var(--line)}
.btn.big{font-size:22px;padding:13px 24px}.full{width:100%;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:600 14px Rubik,system-ui,sans-serif;color:var(--ink);cursor:pointer;line-height:1.2}
.chip:disabled{cursor:not-allowed;opacity:.38}.chip.ro{cursor:default}
.chip.on{border-color:var(--accent);background:var(--accent);color:#fff}
.chip.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px var(--shadow);padding:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card{background:var(--card)}
.inp{width:100%;font:600 18px Rubik,system-ui,sans-serif;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.lbl{display:block;font-weight:600;margin:12px 0 6px}
.flag{flex:none;display:inline-block;vertical-align:middle;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.flag.wave{animation:wave 2.4s ease-in-out infinite;transform-origin:left center}
@keyframes wave{0%,100%{transform:skewY(0) scaleX(1)}25%{transform:skewY(-3deg) scaleX(.97)}75%{transform:skewY(3deg) scaleX(.99)}}
.uic{fill:currentColor;vertical-align:middle;flex:none}.uemo{vertical-align:middle}
.intro{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px;text-align:center;background:radial-gradient(ellipse at 50% 120%,#3b5b2a 0%,transparent 55%),linear-gradient(180deg,#0f2747 0%,#285a8c 50%,#e9a65a 100%);color:#fff;overflow:hidden;position:relative}
.clouds{position:absolute;inset:0;background:radial-gradient(60px 24px at 15% 22%,rgba(255,255,255,.75) 98%,transparent),radial-gradient(90px 32px at 22% 24%,rgba(255,255,255,.7) 98%,transparent),radial-gradient(70px 26px at 78% 16%,rgba(255,255,255,.7) 98%,transparent),radial-gradient(100px 34px at 86% 19%,rgba(255,255,255,.65) 98%,transparent);animation:drift 30s linear infinite;pointer-events:none}
@keyframes drift{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
.ttl{position:relative;margin:0;display:flex;flex-direction:column;line-height:.95;font-size:clamp(50px,12vw,120px);color:#ffd43b;text-shadow:0 6px 0 #0b1a2e,4px 4px 0 #0b1a2e,-3px -3px 0 #0b1a2e,3px -3px 0 #0b1a2e,-3px 3px 0 #0b1a2e,0 0 40px rgba(255,180,60,.5)}
.ttl span{display:block;animation:slam .7s cubic-bezier(.2,1.6,.4,1) both;animation-delay:var(--d,0s)}
.ttl span:nth-child(2){color:#ff6b6b;font-size:.6em}.ttl.sm{font-size:clamp(40px,9vw,80px)}
@keyframes slam{from{transform:translateY(-120px) scale(1.6);opacity:0}to{transform:none;opacity:1}}
.sub{position:relative;margin:0;font:600 18px Rubik,sans-serif;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.4)}
.roll{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:760px}
.roll span{animation:rise .8s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--k)*.09s + .8s)}
@keyframes rise{from{transform:translateY(80px) scale(.4);opacity:0}to{transform:none;opacity:1}}
.bar{position:relative;width:min(360px,80vw);height:14px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd43b,#ff922b);transition:width .15s}
.pulse{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.07)}}
.mbtns{position:relative;display:flex;flex-direction:column;gap:12px;width:min(440px,92vw)}
.mbtn{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;text-align:left;padding:14px 18px;border-radius:18px;border:1px solid rgba(255,255,255,.25);background:rgba(10,20,35,.6);backdrop-filter:blur(8px);color:#fff;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.35);font-family:Rubik,sans-serif;transition:transform .12s}
.mbtn:hover{transform:translateY(-2px)}.mbtn .e{grid-row:1/3;font-size:38px}.mbtn b{font:26px "Lilita One",Rubik,sans-serif}.mbtn small{color:#c9d6e3;font-size:14px}
.how2 p{line-height:1.5;margin:8px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.lobby{display:grid;grid-template-columns:minmax(320px,460px) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:1000px){.lobby{grid-template-columns:1fr}}
.set h3{font-size:17px;margin:14px 0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:520px){.grid3{grid-template-columns:1fr}}
.mode{display:flex;text-align:left;width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer}
.mode.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.mode b{display:block;font:17px "Lilita One",Rubik,sans-serif}.mode span span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.3}
.prow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.how{background:var(--paper);border-radius:12px;padding:10px 12px;margin-top:10px;line-height:1.5;font-size:14px}
.banner{font:20px "Lilita One",Rubik,sans-serif;text-align:center;color:#fff;background:linear-gradient(90deg,#0f2747,#1c4f82);border-radius:12px;padding:8px 12px;margin:0 0 10px;letter-spacing:.03em}
.game{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px;align-items:start}
@media(max-width:1100px){.game{grid-template-columns:1fr}}
.mapwrap{position:relative;border-radius:18px;overflow:hidden;line-height:0;box-shadow:0 12px 34px var(--shadow);border:1px solid var(--line);min-height:200px}
.mapwrap canvas{display:block;cursor:grab}.mapwrap canvas:active{cursor:grabbing}
.mapctl{position:absolute;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;line-height:1.2;z-index:3}
.mapctl .chip{background:var(--panel);backdrop-filter:blur(6px)}
.hud{position:absolute;top:10px;left:10px;max-width:340px;line-height:1.35;z-index:2}
.newsbox{position:absolute;top:56px;right:10px;width:430px;max-height:calc(100% - 66px);overflow:auto;line-height:1.35;z-index:2}
@media(max-width:1100px){.hud,.newsbox{position:static;max-width:none;width:auto;max-height:none;margin:10px;border-radius:14px}.mapwrap{overflow:visible}}
.day{font-size:42px;line-height:1;color:var(--accent)}.day small{font-size:19px;color:var(--muted)}
.side{max-height:calc(100vh - 90px);overflow:auto}.side h3{margin-top:0}
.cty{display:flex;gap:9px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line)}
.cty b{font-size:15px}.cty small{display:block;color:var(--muted);font-size:12px}.cty .rk{width:18px;color:var(--muted);font-weight:800}.cty .sc{font-weight:800;font-size:13px}
.cty.me{background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:10px}
.pact{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 0;font-size:14px}.pact span{display:flex;gap:3px;flex-wrap:wrap}
.wars{display:flex;flex-wrap:wrap;gap:8px}.wars span{display:flex;align-items:center;gap:2px}
.mast{font:clamp(24px,3vw,34px) "Lilita One",Rubik,sans-serif;text-align:center;border-bottom:4px double var(--ink);padding-bottom:6px}
.mast small{display:block;font:600 12px Rubik,sans-serif;color:var(--muted);letter-spacing:.08em}
.tabs{margin:10px 0}
.hl{font-size:23px;line-height:1.18;margin:8px 0 4px;animation:in .5s both}
.nl{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:9px}
.nl li{display:flex;gap:9px;align-items:flex-start;line-height:1.38;font-size:14.5px;animation:in .45s both;animation-delay:calc(var(--k,0)*.12s + .15s)}
.nl em{display:block;font-size:12px;color:var(--muted);font-style:normal}.nl em.tg{font:12px "Lilita One",Rubik,sans-serif;letter-spacing:.06em}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ticker{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;background:rgba(10,16,24,.9);color:#fff;padding:10px 14px;font:600 16px Rubik,sans-serif;line-height:1.3;z-index:2;overflow:hidden}
.ticker b{background:var(--bad);padding:3px 8px;border-radius:6px;font-family:"Lilita One",Rubik,sans-serif;font-weight:400;white-space:nowrap;flex:none}
.ticker.slow b{background:#1c4f82}.mq{overflow:hidden;white-space:nowrap;flex:1}.mq span{display:inline-block;padding-left:100%;animation:mq 45s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
.tv{position:absolute;inset:0;z-index:4;pointer-events:none;line-height:1.3;color:#fff}
.tv .chip{pointer-events:auto}
.tvtop{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:center}
.tvlogo{font:22px "Lilita One",Rubik,sans-serif;background:#0b1320;padding:6px 12px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.4)}.tvlogo b{color:#ff6b6b;font-weight:400}
.live{background:#e03131;padding:5px 10px;border-radius:6px;font-weight:800;animation:blink 1.2s infinite}@keyframes blink{50%{opacity:.55}}
.tvday{margin-left:auto;background:rgba(11,19,32,.8);padding:5px 10px;border-radius:6px;font-weight:600}
.anchor{position:absolute;left:14px;bottom:150px;border:3px solid #fff;border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5);line-height:0;background:#1b2a41}
.anchor span{display:block;line-height:1.2;font:600 11px Rubik,sans-serif;text-align:center;padding:3px;background:#0b1320}
.lower{position:absolute;left:14px;right:14px;bottom:48px;display:flex;flex-direction:column;align-items:flex-start}
.lower .tag{font:15px "Lilita One",Rubik,sans-serif;padding:4px 12px;border-radius:6px 6px 0 0;letter-spacing:.06em}
.hd{display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,rgba(11,19,32,.96),rgba(22,40,66,.93));padding:12px 16px;border-radius:0 10px 10px 10px;font:600 clamp(16px,1.8vw,22px) Rubik,sans-serif;max-width:100%;animation:wipe .7s ease-out both;box-shadow:0 8px 24px rgba(0,0,0,.45)}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.crawl{position:absolute;left:0;right:0;bottom:0;background:#ffd43b;color:#111;font:700 15px Rubik,sans-serif;padding:8px 0;overflow:hidden;white-space:nowrap}.crawl div{display:inline-block;padding-left:100%;animation:mq 40s linear infinite}
.tvdots{position:absolute;bottom:44px;right:16px;display:flex;gap:5px}.tvdots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.4)}.tvdots i.on{background:#fff}
.phone{max-width:600px;margin:0 auto;padding:8px}
.pcard{padding:12px}
.phead{display:flex;gap:12px;align-items:center}.phead h2{font-size:26px}
.res{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.res span{display:inline-flex;align-items:center;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:4px 8px;font-size:14px}.res b{font-weight:800}
.warbar{background:color-mix(in srgb,var(--bad) 14%,var(--card));border:1px solid var(--bad);border-radius:10px;padding:6px 10px;font-size:14px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.notif{background:linear-gradient(90deg,#ff8a3d,var(--accent));color:#fff;border-radius:14px;padding:10px 13px;margin:10px 0;font-size:15px}
.notif.ok{background:linear-gradient(90deg,#40c057,var(--ok))}.notif.warn{background:linear-gradient(90deg,#ff6b6b,#c92a2a)}
.notif.pop{animation:drop .6s cubic-bezier(.2,1.4,.4,1) both}@keyframes drop{from{transform:translateY(-40px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.ptabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:10px 0;background:var(--paper);padding:4px;border-radius:14px;border:1px solid var(--line)}
.ptabs button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font:600 11.5px Rubik,sans-serif;padding:6px 2px;border-radius:10px;cursor:pointer}
.ptabs button span{font-size:20px}.ptabs button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px var(--shadow)}
.pmapbox{position:relative;line-height:0}.mapscroll{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#6fb2e4}
.pmapbox .mapctl{top:8px;right:8px}
.pv{background:var(--paper);border-radius:14px;padding:12px;margin-top:10px;border:1px solid var(--line)}
.pv h3{margin:0 0 4px;display:flex;align-items:center;gap:8px}.pv.offer{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pv.offer small{display:block;color:var(--muted)}
.slots{display:flex;gap:5px;margin:8px 0}.slot{width:34px;height:34px;border-radius:9px;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:19px}.slot.on{border-style:solid;background:var(--card)}.slot.pend{border-color:var(--accent)}
.acts{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.act{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 16px Rubik,sans-serif;cursor:pointer}
.act:disabled{opacity:.4;cursor:not-allowed}.act.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.act .e{font-size:24px}.act .g{flex:1}.act small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.bgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.bb{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;column-gap:8px;align-items:center;text-align:left;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-family:Rubik,sans-serif}
.bb:disabled{opacity:.4;cursor:not-allowed}.bb span{grid-row:1/3;font-size:24px}.bb b{font-size:14px}.bb small{grid-column:2;color:var(--muted);font-size:11.5px;line-height:1.2}.bb i{grid-row:1/3;grid-column:3;font-style:normal;font-weight:800;font-size:13px}
.ugrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.uc{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px;position:relative;color:var(--ink)}
.uc .n{position:absolute;top:8px;right:10px;font:24px "Lilita One",Rubik,sans-serif;color:var(--accent)}.uc small{color:var(--muted);font-size:12px;line-height:1.25}.uc .req{color:var(--bad)}
.tlist{display:flex;flex-direction:column;gap:7px}.tr{display:flex;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.tr .e{font-size:24px}.tr small{display:block;color:var(--muted);font-size:12px}.lv{display:flex;gap:3px;margin-top:4px}.lv i{width:16px;height:6px;border-radius:3px;background:var(--line)}.lv i.on{background:var(--gold)}
.rel{display:flex;gap:9px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.rel small{display:block;color:var(--muted);font-size:12px}.ra{display:flex;gap:5px;flex-wrap:wrap}
.good{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
.spyl{display:flex;flex-wrap:wrap;gap:6px}
.foot{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);margin:12px -12px -12px;padding:10px 12px;border-radius:0 0 18px 18px;box-shadow:0 -8px 20px var(--shadow);z-index:5}
.foot summary{cursor:pointer;padding:4px 0}
.olist{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:5px;max-height:30vh;overflow:auto}
.olist li{display:flex;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:14px}.olist li span{flex:1}
.win{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.score{text-align:left;width:100%;max-width:440px}.score li{margin:5px 0}.score small{display:block;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:20;padding:10px}
.modal>.card{max-height:94vh;overflow:auto;width:min(620px,100%)}
#err{position:fixed;left:10px;right:10px;bottom:10px;z-index:99;background:#c92a2a;color:#fff;padding:12px 14px;border-radius:12px;font:600 15px Rubik,sans-serif}

#ln{flex:1}.chips .btn.ghost{white-space:nowrap}
.rel .grow,.pv.offer .grow{min-width:170px}.ra{margin-left:auto}

.ticker{position:static;padding:4px 10px;font:600 13px Rubik,sans-serif;gap:8px;line-height:1.4}
.ticker b{padding:1px 6px;font-size:12px;border-radius:4px}
.crawl{font:600 12px Rubik,sans-serif;padding:3px 0}.lower{bottom:28px}.tvdots{bottom:24px}.anchor{bottom:120px}
.hud{padding:10px 12px;max-width:290px}.hud .day{font-size:30px}.hud p{margin:6px 0;font-size:14px}
.ball{flex:none;display:inline-block;vertical-align:middle;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
.roll .ball{animation:hop 1.6s ease-in-out infinite}@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px) rotate(-6deg)}}

.uw{position:relative;display:inline-block;line-height:0}.ub{position:absolute;left:28%;top:-38%}.ub .ball{filter:none}

function validOrd(g,c,o){if(!Array.isArray(o))return false;const t=o[0],C=g.C[c];
 switch(t){case 't':return g.own[o[1]]===c;
  case 'b':return g.own[o[1]]===c&&!!BLD[o[2]]&&(!BLD[o[2]].era||g.era>=BLD[o[2]].era)&&(!BLD[o[2]].coast||MAP.cc[o[1]])&&(g.bld[o[1]]||'').length<slots(o[1]);
  case 'a':return g.own[o[1]]===c&&!!MAP.adj[o[1]]&&MAP.adj[o[1]].includes(o[2])&&(o[3]==='a'||o[3]==='h')&&typeof o[4]==='string';
  case 'm':case 'n':return g.own[o[1]]!==c&&g.own[o[1]]>=0&&(o[0]==='m'||g.nk!=='kapali');
  case 'u':return UT.includes(o[1])&&!!UN[o[1]][g.era];
  case 'r':return !!TECH[o[1]]&&C.t[o[1]]<5;
  case 's':return !!g.C[o[1]]&&o[1]!==c&&'cgid'.includes(o[2]);
  case 'e':case 'v':return true;case 'k':return !!g.C[o[1]]&&g.C[o[1]].alive&&o[1]!==c;
  case 'w':case 'p':case 'i':case 'c':return !!g.C[o[1]]&&g.C[o[1]].alive&&o[1]!==c;
  case 'x':return !!g.C[o[1]]&&g.own[o[2]]===o[1]&&o[1]!==c}return false}
function normPk(pk){if(Array.isArray(pk))return{o:pk,r:{}};if(pk&&typeof pk==='object')return{o:Array.isArray(pk.o)?pk.o:[],r:pk.r&&typeof pk.r==='object'?pk.r:{}};return null}
function validPk(p,pk){const q=normPk(pk);return !!q&&q.o.length<=opMax(G)&&q.o.every(o=>validOrd(G,p.c,o)&&canOrd(G,p,o[0]))}

function pAct(a,ds,x){const st=x.st,g=x.g,p=st.sel,me=g.P.find(q=>q.pid===x.pid);
 switch(a){
 case 'tab':st.tab=ds.v;return true;case 'ntab':st.ntab=ds.v;return true;case 'spm':st.spm=ds.v;return true;case 'spt':st.spt=+ds.v;return true;case 'btype':st.bt=ds.v;return true;case 'bcity':if(st.bt)addOrd(x,['b',+ds.v,st.bt]);return true;case 'oe':addOrd(x,['e']);return true;case 'ov':addOrd(x,['v']);return true;
 case 'ot':addOrd(x,['t',p]);return true;case 'bsel':{const v=+ds.v;st.bsel=st.bsel===v?-1:v;st.sel=v;return true}case 'mode2':st.mode=st.mode===ds.v?null:ds.v;return true;
 case 'ob':addOrd(x,['b',p,ds.v]);return true;case 'amt':st.amt=ds.v;return true;
 case 'sup':st.sup=st.sup.includes(ds.v)?st.sup.replace(ds.v,''):st.sup+ds.v;return true;

const MUS={on:lsGet('bw_mus')!=='0',ctx:null,t:0,step:0,timer:null,
 init(){if(this.ctx)return;try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.mg=this.ctx.createGain();this.mg.gain.value=.16;this.mg.connect(this.ctx.destination)}catch(e){this.ctx=null}},
 note(f,t,d,type,v){const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(this.mg);o.start(t);o.stop(t+d+.05)},
 kick(t){const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.18);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(this.mg);o.start(t);o.stop(t+.3)},
 snare(t){const c=this.ctx,b=c.createBuffer(1,c.sampleRate*.15,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();f.type='highpass';f.frequency.value=1500;s.buffer=b;g.gain.value=.35;s.connect(f);f.connect(g);g.connect(this.mg);s.start(t)},
 tick(){if(!this.ctx||!this.on)return;const c=this.ctx,sp=60/96/4;if(this.t<c.currentTime)this.t=c.currentTime+.05;
  const CH=[[220,261.6,329.6],[174.6,220,261.6],[261.6,329.6,392],[196,246.9,293.7]],B=[110,87.3,130.8,98],MEL=[440,523.3,587.3,659.3,784,659.3,587.3,523.3];
  while(this.t<c.currentTime+.25){const s=this.step%64,bar=(this.step>>4)%4,t=this.t;
   if(s%4===0)this.kick(t);if(s%8===4)this.snare(t);if(s%2===0)this.note(B[bar]*(s%8===6?2:1),t,.22,'triangle',.35);
   if(s%16===0)CH[bar].forEach(f=>this.note(f,t,sp*15,'sine',.07));
   if(s%4===2&&Math.random()<.55)this.note(MEL[(bar*2+((s/4)|0))%8]*(Math.random()<.3?.5:1),t,.3,'square',.045);
   this.t+=sp;this.step++}},
 start(){this.init();if(!this.ctx)return;this.ctx.resume&&this.ctx.resume();if(!this.timer)this.timer=setInterval(()=>this.tick(),90)},
 toggle(){this.on=!this.on;lsSet('bw_mus',this.on?'1':'0');if(this.on)this.start();const b=document.getElementById('mus');if(b)b.textContent=this.on?'🔊':'🔇'},
 jingle(){if(!this.ctx||!this.on)return;const t=this.ctx.currentTime+.05;[523.3,659.3,784,1046.5].forEach((f,i)=>this.note(f,t+i*.12,.35,'square',.08))}};
document.addEventListener('click',e=>{if(e.target.closest('[data-mus]')){MUS.toggle();return}if(MUS.on)MUS.start()},true);
(function(){const b=document.createElement('button');b.id='mus';b.dataset.mus='1';b.className='musbtn';b.title='Müzik';b.textContent=MUS.on?'🔊':'🔇';document.body.appendChild(b)})();
