
name: Bayrak Savaşları - Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Oyunu yayımla
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: GitHub Pages ayarlarını yap
        uses: actions/configure-pages@v5

      - name: Oyun dosyalarını hazırla
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Oyunu yayımla
        id: deployment
        uses: actions/deploy-pages@v4
