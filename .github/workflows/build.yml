name: Derle (Play AAB + APK + Web)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KS: ${{ secrets.KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASS: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - name: AdMob uygulama kimligini ekle
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          ID="${ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}"
          sed -i "s#</application>#<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ID\"/></application>#" android/app/src/main/AndroidManifest.xml
          grep -q "com.android.vending.BILLING" android/app/src/main/AndroidManifest.xml || sed -i "s#<application#<uses-permission android:name=\"com.android.vending.BILLING\"/><application#" android/app/src/main/AndroidManifest.xml
      - name: Uygulama ikonunu olustur
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0f2747' --iconBackgroundColorDark '#0f2747' --splashBackgroundColor '#0f2747' --splashBackgroundColorDark '#0f2747'
      - run: npx cap sync android
      - name: Surum numarasini ayarla (her derlemede artar)
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Deneme APK (telefona direkt kurulur)
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BayrakSavaslari-APK-deneme
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Google Play icin AAB (imzali)
        if: ${{ env.KS != '' }}
        run: |
          echo "$KS" | base64 -d > upload.jks
          cd android && ./gradlew bundleRelease
          jarsigner -keystore ../upload.jks -storepass "$KS_PASS" -keypass "$KEY_PASS" -signedjar ../BayrakSavaslari-play.aab app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
      - uses: actions/upload-artifact@v4
        if: ${{ env.KS != '' }}
        with:
          name: BayrakSavaslari-GooglePlay-AAB
          path: BayrakSavaslari-play.aab
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - uses: actions/deploy-pages@v4
